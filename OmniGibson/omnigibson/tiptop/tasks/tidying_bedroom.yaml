# Three moves in one bedroom: two sandals off the floor to beside the bed, and one book off the bed onto a
# nightstand. The goal is three atoms -- (nextto sandal_1 bed_1), (nextto sandal_2 sandal_1), and an exists over
# the two table.n.02 instances for (ontop book_1 table) -- and none holds at the start: :init has both sandals
# ontop the floor and the book ontop the bed. Nothing is toggled, nothing is closed, so no press and no open.
#
# What the names are in the shipped instance (house_single_floor, bedroom_0, 300 sampled states):
#  - sandal.n.01_1/_2 are the sandal models txkidl and tkfdsk, each 23.7 x 9.0 x 3.4 cm, lying flat on the
#    bedroom floor (z of the root about 0.007) anywhere from 1.4 to 3.9 m from the bed's centre, mean 2.3 m.
#  - book.n.02_1 is the hardback dmqfqx, 19.2 x 13.4 x 2.1 cm, lying flat on the mattress at z about 0.50,
#    sampled anywhere over the bed's footprint.
#  - table.n.02_1 and table.n.02_2 are both the nightstand wbxekb (0.48 x 0.78 m footprint, top surface about
#    0.34 m above the floor, one rigid link, so no drawer to open). They flank the head of the bed
#    (bed gxfipj, 2.14 x 1.80 x 0.80 m). The exists wraps a single item, so the two are genuinely
#    interchangeable and nothing can be split between them -- the instruction need not say "the same".
#
# Hard for an 8 cm parallel jaw, and for the runner's ordering:
#  - A sandal is 9.0 cm across, just past the jaw; the only dimension it can span is the 3.4 cm height of a shoe
#    lying sole-down on the floor, with no clearance underneath to get a finger in. Both picks are floor-level.
#  - The book is 2.1 cm thick, so the only hold is cover to cover, and it lies flat on a mattress that gives
#    under the fingers. The bed is not in SUPPORT_CATEGORIES ("table", "floor"), so it reaches the planner as a
#    tracked object rather than as the plane the book rests on, and the bed is 1.80 m across, so a book sampled
#    toward the middle has to be reached over the mattress.
#  - sandal_1 is both an item and the container for sandal_2. It has to be moved first: a sandal_2 released
#    beside where sandal_1 started stops being next to it once sandal_1 is carried to the bed. The runner takes
#    containers nearest their items first, and in 88 of the 300 shipped states the two sandals lie closer to
#    each other (mean gap 1.74 m) than sandal_2 lies to the bed's box (mean 1.05 m), so that order is what it
#    would pick in those.
#  - Both sandal atoms are nextto, which goes on the wire as the planner's "near" -- a place with no container
#    to aim into. The target for the first is the bed, a 2.1 x 1.8 m object, and for the second another 24 cm
#    sandal lying on the floor.
#  - The book's target is a table.n.02, which the bridge renames to the planner's support plane ("table"), so
#    the release lands on whatever plane is detected from the stance; the nightstand top is a low 0.34 m.
task: tidying_bedroom
instruction: put the sandals side by side next to the bed and the book on the nightstand
plan: transfer  # no toggled_on and no open atom in the goal; all three atoms are a pick, a carry and a release
