# One jar of honey from a countertop into a cabinet: the smallest transfer in the challenge set, one item and one
# container, which makes it the cheapest end-to-end check that a task the pipeline has never seen works at all.
# New ground: the item stands on a countertop, which is not one of SUPPORT_CATEGORIES (tables and floors).
#
# RUN 1 (2026-09-13, runs/bench_store_honey_1): 0.0, and it is the cleanest demonstration of the missing
# skill in the set. The pick worked and the place executed; the jar finished with its bottom at z 0.84 and
# the cabinet's top at 0.85 -- ON the cabinet, not in it. "inside a cabinet" needs the door opened and the
# jar put in the cavity, and with no open skill the cabinet is a solid hull whose top is the only surface
# the placement can find. This task is therefore the cheapest end-to-end test of an open/close skill:
# one item, one container, and opening the door is the only thing between the runner and the goal.
task: store_honey
instruction: put the jar of honey in the cabinet
plan: transfer

# Tailored 2026-09-13, with the user's leave to hardcode ("open may not need to be generic to all drawer and
# cabinet, you can tailor to a certain task a certain drawer"). The smoke tests opened this cabinet by taking
# hold of j_link_4 at z 0.74 and pulling 80% of its range: the joint went 0.000 -> 0.130 of [0, 0.39], well past
# the 5% OmniGibson flips Open at. The other three drawers sit at z 0.11, 0.32 and 0.53; the lowest is out of the
# arm's reach with the torso locked at the challenge posture. Naming the drawer skips that search.
opens:
  cabinet.n.01_1:
    joint: j_link_4
    height: 0.74
    fraction: 0.8
