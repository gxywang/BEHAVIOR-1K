# Six books out of four bookcases in the living room and into one box on the floor. The :init spreads them two
# in bookcase_1, two in bookcase_2, one in bookcase_3, one in bookcase_4; the box starts ontop the floor and the
# goal never asks it to move. The goal is a single forall -- every book inside box.n.01_1 -- so one container
# takes all six and the demand is flat: no pairing, no interchangeable containers, six inside atoms.
#
# What is hard here, on top of the transfers the pipeline already does:
#  - Every book starts INSIDE a bookcase, not on a table or a floor. This is re_shelving_library_books run
#    backwards: there the books came off a table into a shelf, here each PICK reaches into a shelf cavity from
#    the side. Neither the support plane the planner is given nor the "nearest the edge" ordering applies to a
#    book standing on a shelf.
#  - The books are spread over four separate bookcases, so the episode needs four stances to collect six items
#    plus the stance at the box -- more base motion per item than any transfer task run so far.
#  - The box is the only place everything goes, and it stands on the floor, so every release is a low reach.
#    It is an open tray, though: the sampling whitelist picks one storage_box scaled to 0.48 x 0.50 x 0.12 m,
#    so "inside" is a drop through an open top, with no door to open (unlike store_honey's cabinet).
#  - Jaw: the whitelist (OmniGibson/scripts/sampling/task_custom_lists.json) allows thirteen hardback models,
#    measuring roughly 0.17-0.26 m x 0.15-0.19 m x 0.02-0.03 m. An 8 cm jaw can only pinch a book across its
#    covers, the 2-3 cm dimension; across either face dimension it is two to three times too wide. On a shelf
#    that pinch has to enter the gap beside the book, and two of the bookcases hold two books each.
task: boxing_books_up_for_storage
instruction: put the books in the box
plan: transfer
