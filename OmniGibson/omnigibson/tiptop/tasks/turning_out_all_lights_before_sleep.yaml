# Five toggleable objects, all of them already on at the start, and nothing to carry: three wall switches
# (electric_switch, one each in the kitchen, the utility room and the dining room) and two table lamps (one on
# the coffee table in the living room, one on the countertop in the utility room). The goal is two foralls --
# every switch off and every table lamp off -- so every atom reaches the runner as not(toggled_on, x) and every
# one of them is a press. The agent starts on the corridor floor of house_single_floor; the five objects sit in
# four rooms, so most of the episode is driving between rooms and finding one small object per room.
# Hard for an 8 cm parallel jaw: a wall switch is a flat plate fixed to the wall with nothing to close the
# fingers around, and it is at wall height rather than on a support, so it can only be poked where it stands --
# hence press: in_place. The two lamps are free-standing and breakable, and their toggle is on the lamp body
# rather than in the hand, so they are pressed in place as well rather than picked up first.
task: turning_out_all_lights_before_sleep
instruction: turn off the light switches and the table lamps
plan: press
press: in_place
