# Six household items out of two hampers on a bedroom floor and into four different places in the neighbouring
# bathroom: both bottles of detergent under the sink and side by side, the box of sanitary napkins onto the
# shelf, the soap dispenser onto the sink, the tube of toothpaste beside the cup and the toothbrush into the
# cup. :init has bottle_1, bottle_2 and the box inside basket.n.01_1 and the soap dispenser, the toothpaste and
# the toothbrush inside basket.n.01_2, both baskets ontop the bedroom floor, and the cup already ontop the sink
# -- so (ontop cup sink) is the one goal atom true at the start, and the cup is a target the other two items
# come to rather than something to move. Nothing is toggled and nothing is closed: no press, no open.
#
# The goal's two `under` atoms (a forall over the two detergent bottles) are not among the runner's
# PLACE_PREDICATES (inside/ontop/on/nextto), so it logs "no sub-plan for goal atoms ['under']" and leaves them
# alone; the only bottle work it schedules is the separate (nextto bottle_1 bottle_2) atom, whose container is
# bottle_2 itself, which the runner never moves -- so that pairing is made wherever bottle_2 stands, in the
# basket in the bedroom. Under (object_states/under.py) asks that the sink be a positive vertical neighbour of
# the bottle, i.e. the bottle must end up in the space beneath the sink body.
#
# The shipped instance (house_single_floor, sorting_household_items_0, 300 sampled states), items in bedroom_0,
# sink and shelf in bathroom_1; the robot starts in the bedroom at (21.85, 23.02):
#  - basket.n.01_1/_2 are both the hamper drgdfh, 35 x 54 x 19.8 cm, open-topped, one rigid link (no lid).
#    Across the 300 states they and their contents are re-sampled anywhere in the bedroom, x 19.9-24.2,
#    y 21.9-25.8, which puts them 2.2 to 6.5 m from the sink, mean 4.4 m. The cup never leaves the sink
#    (its centre stays within 0.8 m of the sink's).
#  - bottle__of__detergent.n.01_1 is qjkmhq, 9.2 x 12.5 x 28.4 cm, and _2 is gkpmii, 10.3 x 15.6 x 28.4 cm.
#    Both stand upright in basket_1, 11 to 34 cm apart (mean 20 cm), each about 10 cm taller than the 19.8 cm
#    basket wall.
#  - box__of__sanitary_napkin.n.01_1 is zqinib, 7.0 x 10.3 x 10.9 cm, upright in basket_1 with its top about
#    8 cm below the rim.
#  - soap_dispenser.n.01_1 is jmulpc, 13.7 x 18.4 x 17.9 cm, standing in basket_2 with its top level with
#    the rim.
#  - tube__of__toothpaste.n.01_1 is vsclsj, 14.0 x 4.0 x 2.7 cm, and toothbrush.n.01_1 is vkrjps at scale 1.5,
#    22.1 x 1.7 x 2.6 cm; both lie flat on the floor of basket_2, under 4 cm of anything to grip.
#  - cup.n.01_1 is the coffee cup ykuftq scaled to 13.5 x 9.0 x 15.0 cm, standing on the sink.
#  - sink.n.01_1 is multi_station_furniture_sink upwldu, fixed, one rigid link, 0.52 x 1.61 x 1.01 m on the
#    bathroom floor; the cup rests on it with its base at z 0.72-0.76 across the states, so the counter is about
#    three-quarters of a metre up while the model's box reaches z ~1.00.
#  - shelf.n.01_1 is shelf fjozhc, fixed, one rigid link: a wall ledge 3.21 m long, 9.6 cm DEEP and 3.6 cm
#    thick, its top face at z ~1.06.
#
# Hard for a parallel jaw that opens to 8 cm:
#  - both detergent bottles are over 8 cm on every axis (9.2 cm is the narrowest dimension of either), so no
#    pinch across the body fits; only a neck or cap the bounding box does not show.
#  - the soap dispenser is 13.7 x 18.4 x 17.9 cm -- over the opening on every axis as well.
#  - the box of sanitary napkins fits the jaw on its 7.0 cm face only, and that grasp has to reach down into a
#    19.8 cm deep basket beside two 28 cm bottles.
#  - the toothbrush (1.7 x 2.6 cm in section) and the toothpaste tube (2.7 cm thick) are well inside the jaw but
#    lie flat on the basket's floor, so there is almost nothing standing above the surface to close on, and the
#    pick is made inside the basket.
#  - the toothbrush is 22.1 cm long and the cup is 15.0 cm tall over a 13.5 x 9.0 cm footprint, so "inside" it
#    means leaning a brush longer than the cup into an opening on a counter three-quarters of a metre up.
#  - the shelf is 9.6 cm deep and the box is 10.3 cm across one horizontal axis, so only its 7.0 cm side fits
#    the ledge's depth; the release has to land the box's centre on a strip narrower than the box.
#  - neither sink nor shelf is in SUPPORT_CATEGORIES ("table", "floor"), so both reach the planner as tracked
#    objects rather than as the support plane, the same gap as store_honey's countertop.
task: sorting_household_items
instruction: put the two detergent bottles together under the sink, the box of sanitary napkins on the shelf, the soap dispenser on the sink, the tube of toothpaste next to the cup and the toothbrush in the cup
plan: transfer  # no toggled_on and no open atom in the goal; every atom the runner can act on is a place
