# Three pieces of plywood off the garden floor and onto the corridor floor. The :init puts plywood_1, _2 and _3
# ontop floor.n.01_1 (inroom garden) with the robot standing on that same floor, and the goal is a single forall:
# every plywood ontop floor.n.01_2, the floor inroom corridor. The goal writes that term as ?floor.n.01_2, but
# HEAD strips the leading '?', so it is the one named corridor floor -- one destination, three ontop atoms, none
# of them true at the start, no pairing and no interchangeable containers. Nothing to open, nothing to press.
#
#  - The destination is a floor, not a container, as in laying_tile_floors: there is no bin rim or open box to
#    aim at, only the corridor floor plane, and the release has to land in the corridor rather than near it.
#  - Every carry changes room, garden -> corridor, and the robot starts in the garden, so all three moves are
#    out-of-room traverses. Both ends are at floor level: three low picks and three low releases.
#  - Jaw: the sampler's whitelist (OmniGibson/scripts/sampling/task_custom_lists.json, scene
#    house_double_floor_lower) allows one model, plywood-fkmkqa, scaled to 0.07 x 0.47 x 0.02 m. It is a thin
#    slat rather than a full sheet, so the 7 cm width is just inside the 8 cm the fingers open to and the 2 cm
#    thickness fits easily; the 47 cm length is far beyond the jaw, and a piece lying flush on the floor leaves
#    no clearance underneath, so the grasp has to come from above, across the width or onto the thin edge.
#  - The definition says only that all three start ontop the garden floor; where on it, and how close to each
#    other, is left to the sampler.
task: bringing_in_wood
instruction: put the pieces of plywood on the corridor floor
