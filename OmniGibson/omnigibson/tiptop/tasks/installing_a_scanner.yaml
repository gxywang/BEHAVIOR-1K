# One item and one press, both on the same desk. The BDDL names a scanner, a laptop and a table, all inroom
# private_office; the goal is (nextto scanner laptop) and (toggled_on scanner), so the runner reads one transfer
# (nextto is a place predicate) and one press. The scanner starts ontop the table and off; the laptop starts
# ontop the same table and never moves. Nothing to open, and only one laptop in the definition, so no "same
# <container>" to name.
# In the challenge scene (office_cubicles_right) table.n.02_1 is one fixed desk, 0.90 x 2.78 x 0.77 m, and both
# objects sit on its top: laptop root at z 0.794, scanner at z 0.816. Over the 300 instances the scanner starts
# 0.30-1.93 m from the laptop along that desk (median 0.98 m), so every episode is a pick and a release at
# ~0.79 m height on one surface, in one room, with no carry between rooms.
# Hard for a parallel jaw that opens to 8 cm: the one scanner model (juzkjp) is a flat slab of 31.0 x 21.8 x
# 6.0 cm lying flush on the desk. Both horizontal axes are far wider than the jaw, so the only span left is the
# 6 cm height, and a slab flush on a surface leaves no clearance under it for a finger -- the same problem
# laying_tile_floors and setting_mousetraps meet. The laptop it has to end up beside is itself a loose 20.3 x
# 26.8 x 2.0 cm object rather than a container, so the placement aims at open desk beside it.
# The press is in_place for two reasons: the scanner is too wide for the jaw to lift for a "hold" press, and a
# scanner carried in the right hand is no longer next to the laptop, which would undo the transfer that ran
# first. Its togglebutton is a 9 mm sphere at the end of the long axis (local x +15.8 cm, 0.5 cm above centre),
# about 3.5 cm above the desk top, so the press is a low, near-horizontal poke at the scanner's end face.
task: installing_a_scanner
instruction: put the scanner next to the laptop and turn the scanner on
plan: auto
press: in_place
