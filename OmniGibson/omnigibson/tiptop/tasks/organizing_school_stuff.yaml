# Five school items into one tote bag, and the tote itself onto the bed -- six place atoms, all in one bedroom.
# Start (:init): pencil, book and folder lie on the bed; pen, calculator and the tote lie on the floor. Goal:
# all five items inside the tote (carryall.n.01_1) and the tote ontop the bed. None of the six holds at start.
# table.n.02_1 is in the room and named in :objects but no goal atom touches it.
#
# New ground: the container is itself an item to be moved. Every earlier transfer task left its bin, basket or
# bookcase where it stood; here the tote must both hold the five items and end up on the bed, so the runner's
# order decides whether it carries an empty bag or a full one.
#
# Hard for a parallel jaw that opens to 8 cm:
#  - pencil and pen are thin cylinders (mass 0.05 kg each) lying flat on a bed or floor: well inside the jaw's
#    width, but there is almost nothing to close on above the surface.
#  - book and folder are thin flat slabs; from above the only feature to pinch is an edge.
#  - three items start ON THE BED, a soft, high, deep surface, and the bed is not one of SUPPORT_CATEGORIES
#    ("table", "floor"), so it reaches the planner as a tracked object rather than the support plane under it.
#  - carryall.n.01_1 maps to the "tote" asset and is annotated rigidBody (synsets.csv), so it is a rigid bag,
#    but "inside" it still means dropping through an opening entered from the top while it sits on the floor.
task: organizing_school_stuff
instruction: put the pencil, pen, calculator, book and folder in the tote bag and put the tote bag on the bed
plan: transfer
