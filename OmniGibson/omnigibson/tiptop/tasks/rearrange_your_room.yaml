# Three moves in one hotel bedroom: the two pillows off the bedroom floor onto the two beds, one pillow each,
# and the tissue dispenser off the armchair seat onto the stand. The goal is an exists over stand.n.04 for
# (ontop tissue_dispenser_1 stand), plus a forpairs over the two pillows and the two beds -- a perfect matching,
# so the pillows go to DIFFERENT beds. Nothing holds at the start: :init has both pillows ontop floor_1 and the
# dispenser ontop the armchair. No toggled_on atom and nothing here is openable in synsets.csv, so no press and
# no opens. floor.n.01_2 (the bathroom floor) is named in :objects and :init but no goal atom touches it.
#
# What the names are in the shipped instance (hotel_suite_large, bedroom_0, 300 sampled states):
#  - pillow.n.01_1/_2 are both the pillow ajpapo, 49.0 x 32.7 x 8.9 cm, lying flat on the bedroom floor (root z
#    0.034 in every state), sampled anywhere over it: x -2.00..1.85, y -5.07..2.08, 1.08 to 3.29 m from the
#    nearer bed's centre (mean 2.26 m), and 0.51 to 6.38 m from each other.
#  - bed.n.01_1/_2 are two copies of the bed kddswt, fixed, 2.17 x 1.59 x 0.60 m, at (-1.25, -0.29) and
#    (-1.25, -2.54), mattress top about 0.59 m above the floor. Same pose in all 300 states.
#  - tissue_dispenser.n.01_1 is frdbld, 10.0 x 19.1 x 16.8 cm, standing on the seat of armchair ybcnmu
#    (0.95 x 1.04 x 0.94 m, not fixed_base) at z about 0.49; its pose is sampled over the seat, x 1.31..1.74,
#    y -4.54..-4.09.
#  - stand.n.04_* resolves to exactly one object, stand_dbskvf_0: a fixed low ledge 0.56 m deep and 7.54 m long
#    running the length of the room at x about 2.06 (y -5.31..2.23), top surface 0.37 m above the floor. The
#    exists has a single candidate, so nothing can be split between stands.
#
# Hard for a parallel jaw that opens to 8 cm:
#  - a pillow's smallest dimension is 8.9 cm, already past the jaw, and its other two are 49 and 33 cm; lying
#    flat on the floor it leaves no clearance underneath for a finger. pillow.n.01 is annotated softBody in
#    synsets.csv, but this instance ships it with prim_type 0 (rigid), so it will not squash under the fingers.
#  - the tissue dispenser is past the jaw on every axis too -- 10.0 cm is its narrowest -- and it starts on a
#    cushioned armchair seat boxed in by arms and a back 0.94 m tall, on a chair that is not fixed and so moves
#    if it is nudged.
#  - both pillows on one bed scores neither pair atom; the demand read off the goal's options is one pillow per
#    bed, so the runner must reach both beds.
#  - neither "bed" nor "stand" is in SUPPORT_CATEGORIES ("table", "floor"), so both reach the planner as tracked
#    objects rather than as the support plane under the items. A pillow has to be released over a 2.17 x 1.59 m
#    mattress whose top is 0.59 m up and which gives under the hand, and the stand's top is a low 0.37 m.
task: rearrange_your_room
instruction: put one pillow on each of the two beds and put the tissue dispenser on the stand
plan: transfer  # every goal atom is a pick, a carry and a release; no toggled_on, nothing to open
