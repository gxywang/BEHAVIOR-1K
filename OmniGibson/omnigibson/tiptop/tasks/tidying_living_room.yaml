# Four items tidied within one living room, and unlike every earlier transfer task they do NOT share a
# destination: the pot plant and the newspaper start ontop the floor and go ontop the coffee table, the
# hardback starts ontop the coffee table and goes inside a bookcase, the notebook starts ontop the coffee
# table and goes ontop the desk. Four goal atoms, none true at start; floor, coffee table, desk and the
# bookcases are all inroom living_room, and the agent starts on the floor.
#
# The hardback's atom is wrapped in an "exists a bookcase" over bookcase.n.01_* (a wildcard, so the instance
# may hold more than one). Only that one item goes there, so nothing can be split across two bookcases the
# way seven toys could in collecting_childrens_toys.
#
# The coffee table is both a source and a destination: two items come off it and two go onto it, so the
# runner's order decides whether it places the pot plant and the newspaper onto a top that still has the
# book and the notebook on it. coffee_table.n.01 is annotated breakable in synsets.csv (the glass-top
# asset), the surface the radio slid across in turning_on_radio.
#
# Hard for a parallel jaw that opens to 8 cm:
#  - the pot plant is tall and top-heavy and its pot is wider than the jaw across the base, so the grasp has
#    to find the stem or the rim, and it has to be lifted from the floor up onto a table top and released
#    upright, not dropped.
#  - the newspaper is a thin flat slab lying on the FLOOR: nothing to close on above the surface, only an
#    edge to pinch, and the pick is at ground level. It is annotated rigidBody (a folded-newspaper asset),
#    not cloth.
#  - the hardback and the notebook are thin flat books lying on a table with no gap under them; a hardback
#    can be taken across its covers, a notebook is thinner still.
#  - bookcase.n.01 is fillable and not openable, so "inside" is a shelf cavity entered from the SIDE with no
#    door to open, the same geometry as re_shelving_library_books.
task: tidying_living_room
# The instruction is handed to the planner verbatim, so it names all four items and all three destinations
# in plain English; a collective like "tidy up the living room" would name nothing that is in the scene.
instruction: put the potted plant and the newspaper on the coffee table, the hardback book in the bookcase and the notebook on the desk
plan: transfer  # no toggled_on atom in the goal; all four scored atoms are ontop or inside
