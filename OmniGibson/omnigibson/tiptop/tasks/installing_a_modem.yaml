# One object to carry and one button to press, all in the living room of Rs_int -- the only scene with challenge
# instances for this task (300 of them). The goal is three atoms: the modem toggled_on, the modem nextto the
# television receiver, and, under one exists over the two cabinets, the television AND the modem ontop the SAME
# cabinet. Nothing is inside anything and nothing needs opening; both ends of the carry are open tops.
#
# Where things stand at the start (identical in all 300 instances except the modem, whose position and yaw are
# resampled on the coffee table: x -0.75..-0.20, y -1.77..-0.77):
#   modem.n.01_1   modem/axqxsv, 18.4 x 4.9 x 20.4 cm, standing upright on the coffee table, whose top is z 0.40.
#   television_receiver.n.01_1   standing_tv/udotid, 10 x 70 x 44.5 cm, not fixed, and ALREADY standing on
#                  cabinet.n.01_1 (its underside z 0.757, that cabinet's top 0.755) in every instance -- so that
#                  ontop atom is true when the instance starts and settled() drops it: the television is never
#                  picked up, which is just as well at 70 cm across.
#   cabinet.n.01_1   bottom_cabinet/jhymlr at (1.66, -1.50), 57 x 165 cm, top z 0.75: the television's stand.
#   cabinet.n.01_2   bottom_cabinet/bamfsz at (-1.79, -0.46), 42 x 45 cm, top z 0.72: empty, and 1.5 m from the
#                  coffee table against the other cabinet's 2.1 m, so it is the container order_containers()
#                  reaches for first. A modem left there is neither on the same cabinet as the television nor
#                  next to it, and the exists conjunct wants both on one cabinet -- hence "the same cabinet that
#                  the television stands on" in the instruction.
# The work is therefore one transfer: lift the modem 35 cm off the coffee table onto the cabinet top beside the
# television, then press its button. The modem is the only item to move, so the default two attempts apply.
#
# Hard for a parallel jaw that opens to 8 cm: the modem's only axis inside the jaw is its 4.9 cm thickness -- its
# two faces are 18.4 and 20.4 cm -- so it has to be taken across the thin edge of an upright box, and the target
# is a 0.75 m cabinet top already occupied by a 70 cm television that the placement has to land beside.
task: installing_a_modem
instruction: put the modem on the same cabinet that the television stands on, next to the television, and press its button
plan: auto  # the transfer first, then the toggled_on atom
press: in_place  # a "hold" press picks the object up and never puts it back (the README names this task for it),
                 # and this goal also wants the modem ontop the cabinet and nextto the television at the end, so
                 # the button is pressed where the modem stands. turning_on_radio's note is the counterweight: a
                 # free-standing radio slid 20 cm before an in-place toggle registered.
