# Four shoes off a corridor floor onto one hall stand: two gym shoes (models kmcbym and mcfcwq, 30.6 x 10.8 x
# 14.3 cm and 30.7 x 11.5 x 14.3 cm) and two sandals (vwbomj and dfkzbd, both 25.6 x 10.5 x 11.7 cm). In the 300
# shipped instances of house_double_floor_lower all four stand sole-down on the floor of corridor_0 (root z 0.048
# for the gym shoes, 0.038 for the sandals, yaw the only thing sampled), scattered 0.85 to 7.6 m from the hall
# stand (mean 3.9 m) and 0.16 to 7.6 m from their own partner (mean 2.7 m); only 28 of the 300 start with the two
# gym shoes within half a metre of each other, and 22 of the 300 the two sandals.
# The hall stand is the hall_tree daxzaw, fixed_base, a single rigid link with no joint (so nothing to open),
# 0.58 x 1.71 x 2.37 m, standing in the corridor.
#
# The goal is ten atoms: each of the four shoes touching the hall stand and not touching the floor, plus
# (nextto gym_shoe_1 gym_shoe_2) and (nextto sandal_1 sandal_2). It asks for touching rather than ontop, so any
# contact with the stand counts rather than a sampled support surface. Nothing is toggled and nothing is closed,
# so no press and no opens.
#
# What the runner can act on: place_demand reads inside/ontop/on/nextto only and "touching" is not one of them,
# so the eight touching atoms get no sub-plan (run() logs them as left alone) and the demand is two transfers --
# one gym shoe beside gym_shoe_2, one sandal beside sandal_2. The hall stand never enters the demand as a
# container, so the instruction is the only thing that names the rack to the planner.
#
# Hard for a parallel jaw that opens to 8 cm:
#  - No axis of either shoe fits the jaw. The gym shoe is 10.8-11.5 cm across and 14.3 cm tall, the sandal 10.5 cm
#    across and 11.7 cm tall, and they are 30 and 26 cm long. The hold has to be a pinch on a part -- a heel
#    counter, a strap, the sole edge -- not a span across the box.
#  - All four picks are at floor level, the shoe sitting sole-down with no clearance underneath for the fingers.
#  - Each nextto target is another shoe lying loose on the floor, and beside() wants the two boxes within about
#    6 cm of gap (the norm of the per-axis gaps, against a sixth of the mean of their summed extents), so the
#    release has to be close and it lands next to a 26-30 cm object a knock will move.
#  - The container of each transfer is itself an item of its own kind, as in tidying_bedroom: gym_shoe_2 is the
#    container for the gym shoes and is also in demand.items for that kind, so the candidate list for the kind
#    includes the shoe being aimed at.
task: putting_shoes_on_rack
instruction: put the gym shoes and the sandals on the hall stand, each pair side by side
plan: transfer  # no toggled_on atom in the goal; the two atoms the runner can plan for are both nextto
